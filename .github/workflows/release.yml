name: Automated Release

on:
  push:
    branches:
      - master
      - main

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Plugin Version
        id: get_version
        run: |
          # Extract version, remove carriage returns and spaces
          RAW_VER=$(grep -i "Version:" homey-channel-sync.php | head -n 1 | awk -F': ' '{print $2}' | tr -d '\r' | xargs)
          echo "VERSION=v${RAW_VER}" >> $GITHUB_ENV
          echo "Extracted Tag: v${RAW_VER}"

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Homey Channel Sync ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
